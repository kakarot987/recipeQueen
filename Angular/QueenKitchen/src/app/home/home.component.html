<main class="container py-5">
  <header class="mb-4">
    <h1>Queen's Kitchen</h1>
    <p class="lead">Create, discover and save recipes worth cooking again.</p>
  </header>
  <section class="card shadow-sm mx-auto" style="max-width: 520px">
    <div class="card-body p-4">
      <div class="btn-group mb-4" role="group" aria-label="Account action">
        <button class="btn" [class.btn-dark]="mode === 'login'" [class.btn-outline-dark]="mode !== 'login'" (click)="mode='login';error='';message=''">Sign in</button>
        <button class="btn" [class.btn-dark]="mode === 'register'" [class.btn-outline-dark]="mode !== 'register'" (click)="mode='register';error='';message=''">Register</button>
      </div>
      <div class="alert alert-danger" *ngIf="error" role="alert">{{error}}</div>
      <div class="alert alert-success" *ngIf="message" role="status">{{message}}</div>
      <form (ngSubmit)="submit()">
        <label class="form-label" for="username">Username</label>
        <input class="form-control mb-3" id="username" name="username" [(ngModel)]="username" required minlength="3" maxlength="20">
        <ng-container *ngIf="mode === 'register'">
          <label class="form-label" for="email">Email</label>
          <input class="form-control mb-3" id="email" name="email" type="email" [(ngModel)]="email" required>
        </ng-container>
        <label class="form-label" for="password">Password</label>
        <input class="form-control mb-3" id="password" name="password" type="password" [(ngModel)]="password" required minlength="6">
        <button class="btn btn-warning w-100" [disabled]="busy" type="submit">{{busy ? 'Please wait…' : (mode === 'login' ? 'Sign in' : 'Create account')}}</button>
      </form>
    </div>
  </section>
</main>
