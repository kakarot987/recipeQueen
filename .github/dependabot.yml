version: 2
updates:
  - package-ecosystem: npm
    directory: /Angular/QueenKitchen
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular-framework:
        patterns: ["@angular/*"]
        applies-to: version-updates
        update-types: [patch, minor]
      angular-security:
        patterns: ["@angular/*"]
        applies-to: security-updates
  - package-ecosystem: gradle
    directory: /QueensKitchenSpringBoot
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      jwt-library:
        patterns: ["io.jsonwebtoken:*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
