name: Prepare coordinated RecipeQueen dependency lockfile
on:
  push:
    branches: [maintenance/grouped-angular-jjwt-20261117]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Regenerate npm dependency lock without scripts
        working-directory: Angular/QueenKitchen
        run: |
          npm install -g npm@11
          # The old lockfile pins mutually incompatible exact Angular peers.
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate clean installation and production build
        working-directory: Angular/QueenKitchen
        run: |
          node scripts/check-angular-lock.cjs
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit generated lock only after successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Angular/QueenKitchen/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'build: regenerate coordinated Angular 22 lockfile after validation'
          git push "https://x-access-token:${GH_TOKEN}@github.com/kakarot987/recipeQueen.git" HEAD:maintenance/grouped-angular-jjwt-20261117
