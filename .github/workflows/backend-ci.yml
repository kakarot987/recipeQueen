name: Backend security regression tests
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QueensKitchenSpringBoot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
      - name: Compile and run signup security regression
        run: gradle --no-daemon test --tests '*AuthControllerSignupTests'
