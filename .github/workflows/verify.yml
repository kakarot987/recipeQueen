name: Verify backend and frontend
on:
  push:
    branches: ["feature/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: recipedatabase
          MYSQL_USER: recipe
          MYSQL_PASSWORD: local-ci-password
          MYSQL_ROOT_PASSWORD: local-ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -plocal-ci-root-password --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/recipedatabase?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: recipe
      DB_PASSWORD: local-ci-password
      JWT_SECRET: local-ci-only-jwt-signing-key-of-at-least-64-characters-change-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test backend
        working-directory: QueensKitchenSpringBoot
        run: |
          chmod +x ./gradlew
          ./gradlew test bootJar --no-daemon

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: Angular/QueenKitchen/package-lock.json
      - name: Install and build frontend
        working-directory: Angular/QueenKitchen
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Capture upgraded dependency lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular22-lockfile
          path: Angular/QueenKitchen/package-lock.json
          retention-days: 2

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build API for browser tests
        working-directory: QueensKitchenSpringBoot
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon
      - name: Start application and database
        run: |
          cat > QueensKitchenSpringBoot/.env <<'EOF'
          DB_PASSWORD=ci-local-database-password
          MYSQL_ROOT_PASSWORD=ci-local-root-password
          JWT_SECRET=ci-only-random-jwt-signing-key-at-least-sixty-four-characters-long
          EOF
          docker compose -f QueensKitchenSpringBoot/docker-compose.yml up -d --build
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:5000/actuator/health && break || sleep 3
          done
          curl -fsS http://127.0.0.1:5000/actuator/health
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: Angular/QueenKitchen/package-lock.json
      - name: Start Angular development server
        working-directory: Angular/QueenKitchen
        run: |
          npm install --no-audit --no-fund
          nohup npm start -- --host 127.0.0.1 > /tmp/angular.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4200 >/dev/null && break || sleep 3
          done
          curl -fsS http://127.0.0.1:4200 >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Browser smoke test
        working-directory: Angular/QueenKitchen
        env:
          CI: 'true'
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Print backend and frontend diagnostics on failure
        if: failure()
        run: |
          docker compose -f QueensKitchenSpringBoot/docker-compose.yml logs --tail=120 || true
          tail -n 120 /tmp/angular.log || true
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Angular/QueenKitchen/playwright-report/
          retention-days: 7
