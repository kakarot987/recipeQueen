server.port=${PORT:5000}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/recipedatabase?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:recipe}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
recipe.app.jwtSecret=${JWT_SECRET}
recipe.app.jwtExpirationMs=86400000
app.cors.allowed-origin=${APP_CORS_ORIGIN:http://localhost:4200}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
management.endpoints.web.exposure.include=health,info,prometheus

# API documentation is intentionally limited to development by default; disable in production.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
